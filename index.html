<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Clock</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet">

</head>
<body>
    <div class="hero">
        <div class="mode">
            <img src="icon/dark-mode-night-moon-svgrepo-com.svg" alt="">
        </div>
        <div class="container">
            <div class="clock">
                <span id="hrs" aria-label="Hours">00</span>
                <span>:</span>
                <span id="min" aria-label="Minutes">00</span>
                <span>:</span>
                <span id="scd" aria-label="Seconds">00</span>
            </div>
        </div>
    </div>

<script src="index.js"></script>
</body>
</html>
